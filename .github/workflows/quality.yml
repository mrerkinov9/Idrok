name: Idrok quality gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: idrok-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check supabase-auth.js
          node --check account-session.js
          node --check app.js
          node --check physics.js
          node --check garden.js
          node --check focus-widget.js
          node --check admin.js

      - name: Full test suite
        run: npm test
